name: Discover Trinidad finds

on:
  schedule:
    - cron: "17 13 * * *" # 9:17 AM in Trinidad (UTC-04:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-trinidad-finds
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Discover and publish changed finds
        id: worker
        shell: bash
        run: |
          log_file="$RUNNER_TEMP/cheap-thrills-worker.log"
          set +e
          (
            set -e
            npm ci
            npm run discover
            git config user.name "cheap-thrills-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/finds content/brands public/brands
            if git diff --cached --quiet; then
              echo "No content changes to publish."
              exit 0
            fi
            git commit -m "chore(content): refresh Trinidad finds"
            git push
          ) 2>&1 | tee "$log_file"
          result=${PIPESTATUS[0]}
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL || '@cf/meta/llama-3.3-70b-instruct-fp8-fast' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
      - name: Send Telegram run report
        if: always()
        timeout-minutes: 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
          WORKER_EXIT_CODE: ${{ steps.worker.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          log_file="$RUNNER_TEMP/cheap-thrills-worker.log"
          if [ -f "$log_file" ]; then
            log_excerpt="$(tail -c 2400 "$log_file")"
          else
            log_excerpt="Worker log was not created; check checkout and runner setup steps in the linked run."
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram report skipped: add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID as GitHub Actions secrets."
            exit 0
          fi

          if [ "$JOB_STATUS" = "success" ] && [ "$WORKER_OUTCOME" = "success" ]; then
            icon="✅"
            title="Cheap Thrills discovery succeeded"
          else
            icon="🚨"
            title="Cheap Thrills discovery $JOB_STATUS"
          fi

          message="$(printf '%s %s (run #%s)\nWorker step: %s; exit code: %s\n%s\n\nRecent worker log:\n%s' \
            "$icon" "$title" "$RUN_NUMBER" \
            "${WORKER_OUTCOME:-not started}" "${WORKER_EXIT_CODE:-unavailable}" \
            "$RUN_URL" "$log_excerpt")"

          {
            printf '## %s %s\n\n' "$icon" "$title"
            printf 'Worker step: `%s`; exit code: `%s`.\n\n' "${WORKER_OUTCOME:-not started}" "${WORKER_EXIT_CODE:-unavailable}"
            printf '[Open full GitHub Actions run](%s)\n\n' "$RUN_URL"
            printf 'Recent log excerpt:\n\n```text\n%s\n```\n' "$log_excerpt"
          } >> "$GITHUB_STEP_SUMMARY"

          curl --silent --show-error --fail-with-body --max-time 20 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode "disable_web_page_preview=true"
