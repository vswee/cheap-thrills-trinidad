name: Merge authorised agent contributions

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review, edited]
  workflow_run:
    workflows: [Validate directory contributions]
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: merge-authorised-agent-content
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Privileged job: use only the default branch's script; never execute PR code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/github-script@v7
        env:
          AUTHORISED_AGENT_LOGINS: ${{ vars.AUTHORISED_AGENT_LOGINS }}
        with:
          script: |
            const { mergeAgentContributions } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/auto-merge-agent-content.mjs`);
            await mergeAgentContributions({ github, context, core });
